default_lang: pt-BR

# Kokoro exige o modelo em ONNX e o pacote de vozes em .bin:
#   https://github.com/thewh1teagle/kokoro-onnx/releases/tag/model-files-v1.0
# Os arquivos .pth/.pt distribuidos pelo Speech Note nao servem aqui.
kokoro:
  model: kokoro-v1.0.onnx
  voices_bin: voices-v1.0.bin
  models_dir: /path/to/kokoro/models

# Opcional. Remova a secao inteira se nao usar Piper.
piper:
  models_dir: /path/to/piper/voices

voices:
  pt-BR:
    engine: kokoro
    voice: pf_dora
  en-US:
    engine: kokoro
    voice: af_bella
