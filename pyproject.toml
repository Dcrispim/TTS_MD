[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-md"
version = "0.1.0"
description = "Markdown to speech pipeline with modular parsers and offline TTS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kokoro-onnx>=0.4.0",
    "soundfile>=0.12.0",
    "piper-tts>=1.3.0",
    "onnxruntime>=1.20.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
]

[project.scripts]
tts-md = "tts_md.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tts_md*"]
